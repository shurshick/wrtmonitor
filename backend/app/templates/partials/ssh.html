<section class="card terminal-card" data-terminal-device="{{ device.id }}" data-terminal-state="idle">
  <div class="terminal-card__heading">
    <div>
      <span class="eyebrow">Защищённый канал</span>
      <h2>Терминал OpenWrt</h2>
      <p class="muted">Интерактивная PTY-сессия через сервер WrtMonitor. Порты роутера наружу не открываются.</p>
    </div>
    <div class="terminal-card__actions">
      <span id="terminal-status" class="terminal-status" aria-live="polite">Не подключено</span>
      <button type="button" id="btn-terminal-connect">Подключить</button>
      <button type="button" id="btn-terminal-disconnect" class="button--danger" hidden>Отключить</button>
    </div>
  </div>
  <div id="terminal-container" class="terminal-surface" role="application" aria-label="Терминал роутера"></div>
  <p class="terminal-card__note">Сессия имеет отдельный идентификатор, завершается при закрытии страницы и автоматически истекает через 30 минут бездействия.</p>
</section>

<link href="/static/vendor/xterm/xterm.css" rel="stylesheet">
<script src="/static/vendor/xterm/xterm.js"></script>
<script src="/static/vendor/xterm-addon-fit/xterm-addon-fit.js"></script>
<script src="/static/web-ssh.js?v=0.35.16"></script>
